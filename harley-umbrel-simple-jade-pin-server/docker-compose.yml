version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: harley-umbrel-simple-jade-pin-server_server_1
      APP_PORT: 4443
      PROXY_AUTH_ADD: 'true'
  server:
    image: hlappano/simple-jade-pin-server:v1.0.1
    volumes:
      - ${APP_DATA_DIR}/data:/app/key_data
    ports:
      - "18080:4443"
    command: ["--no-tls", "--listen", "0.0.0.0", "--data-dir", "/app/key_data"]